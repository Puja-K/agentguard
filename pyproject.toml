[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Open-source scanner for finding potentially untested AI agent behaviors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Puja Kamath" }
]
keywords = [
  "ai",
  "agents",
  "evals",
  "testing",
  "llm",
  "agent-testing",
  "evaluation"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

semantic = [
  "openai>=2.0,<3.0",
]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src/agentguard"]

[tool.coverage.run]
source = ["agentguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false